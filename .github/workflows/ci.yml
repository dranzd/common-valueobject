name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Coding standards and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - run: composer validate --strict

      - uses: ramsey/composer-install@v4

      - run: composer cs-check

      - run: composer phpstan

  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.dependencies }} deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        dependencies: [locked]
        include:
          - php: "8.3"
            dependencies: lowest
          - php: "8.5"
            dependencies: highest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run tests with coverage
        run: composer test:coverage

      - name: Run static analysis against the highest dependencies
        if: matrix.dependencies == 'highest'
        run: composer phpstan

      - name: Enforce minimum line coverage
        run: php .github/scripts/coverage-check.php build/clover.xml 95
